name: Frontend APK Pipeline

on:
  push:
    branches:
      - Frontend_UI

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: 17

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # Configure AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Get / Increment Version
      - name: Get Version
        id: version
        run: |
          VERSION_FILE="version.txt"

          if aws s3 ls s3://${{ secrets.S3_BUCKET_APPS }}/$VERSION_FILE; then
            VERSION=$(aws s3 cp s3://${{ secrets.S3_BUCKET_APPS }}/$VERSION_FILE -)
            VERSION=$((VERSION + 1))
          else
            VERSION=1
          fi

          echo $VERSION > $VERSION_FILE
          aws s3 cp $VERSION_FILE s3://${{ secrets.S3_BUCKET_APPS }}/$VERSION_FILE

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Upload APK
      - name: Upload APK
        run: |
          DATE=$(date +'%Y-%m-%d-%H-%M')
          FILE_NAME="payo-v${VERSION}-$DATE.apk"

          aws s3 cp android/app/build/outputs/apk/release/app-release.apk \
          s3://${{ secrets.S3_BUCKET_APPS }}/$FILE_NAME

          echo "=================================="
          echo "APK Uploaded Successfully"
          echo "Download Link:"
          echo "https://${{ secrets.S3_BUCKET_APPS }}.s3.amazonaws.com/$FILE_NAME"
          echo "=================================="