name: Backend CI/CD (Express + Docker + EC2) - PRODUCTION
 
on:
  push:
    branches:
      - Backend
      - main
  workflow_dispatch:
 
jobs:
  # ========== CI JOB (Testing) ==========
  ci:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
 
      - name: Install dependencies
        run: npm install
 
      - name: Test server start
        run: |
          node server.js &
          sleep 5
          curl http://localhost:3001 || echo "Server running successfully"   # ✅ FIXED
 
  # ========== DOCKER BUILD JOB ==========
  docker:
    runs-on: ubuntu-latest
    needs: ci
    if: success()
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Build Docker image
        run: |
          docker build -t payo-app:production .
          docker save payo-app:production -o payo-image.tar
 
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: payo-image.tar
 
  # ========== DEPLOY TO EC2 ==========
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: success()
 
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./
 
      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "payo-image.tar"
          target: "/home/ubuntu/payo-app-prod/"
 
      - name: Deploy with Health Check & Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/payo-app-prod/
 
            echo "=========================================="
            echo "Loading Docker image..."
            echo "=========================================="
            docker load -i payo-image.tar
 
            echo ""
            echo "=========================================="
            echo "Testing new container on port 3002..."
            echo "=========================================="
 
            # ✅ FIXED PORT (3001 inside container)
            docker run -d \
              --name test-container-prod \
              -p 3002:3001 \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              payo-app:production
 
            sleep 10
 
            if curl -f http://localhost:3002/health; then
              echo "Health check PASSED"
 
              docker stop test-container-prod
              docker rm test-container-prod
 
              if docker ps -a --format '{{.Names}}' | grep -q "^payo-app-prod$"; then
                docker tag payo-app-prod payo-app-prod:backup
                docker stop payo-app-prod
                docker rm payo-app-prod
              fi
 
              echo "Starting production container..."
 
              # ✅ FIXED PORT (3001 inside container)
              docker run -d \
                --name payo-app-prod \
                --restart always \
                -p 3001:3001 \
                -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                payo-app:production
 
              sleep 5
 
              if curl -f http://localhost:3001/health; then
                echo "🚀 DEPLOYMENT SUCCESS"
                docker ps | grep payo-app-prod
              else
                echo "❌ Production failed, rolling back..."
                docker stop payo-app-prod
                docker rm payo-app-prod
 
                docker run -d \
                  --name payo-app-prod \
                  --restart always \
                  -p 3001:3001 \
                  -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                  payo-app-prod:backup
              fi
 
            else
              echo "❌ Health check FAILED"
              docker logs test-container-prod --tail 50
              docker stop test-container-prod
              docker rm test-container-prod
              exit 1
            fi
 
            rm -f payo-image.tar
