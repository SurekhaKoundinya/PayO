name: Backend CI/CD (Express + Docker + EC2)

on:
  push:
    branches:
      - backend
  workflow_dispatch:  # Allows manual trigger

jobs:
  # ========== CI JOB (Testing) ==========
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Test server start
        run: |
          node server.js & sleep 5
          curl http://localhost:3000 || echo "Server running successfully"

  # ========== DOCKER BUILD JOB ==========
  docker:
    runs-on: ubuntu-latest
    needs: ci  # Wait for CI to pass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t payo-app .
          docker save payo-app -o payo-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: payo-image.tar

  # ========== DEPLOY TO EC2 JOB ==========
  deploy:
    runs-on: ubuntu-latest
    needs: docker  # Wait for Docker build to complete
    if: always() && needs.docker.result == 'success'  # Only run if Docker succeeded
    
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "payo-image.tar"
          target: "/home/ubuntu/payo-app/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/payo-app/
            
            # Stop and remove old container
            docker stop payo-app || true
            docker rm payo-app || true
            
            # Load new image
            docker load -i payo-image.tar
            
            # Run new container with MongoDB connection
            docker run -d \
              --name payo-app \
              --restart always \
              -p 3000:3000 \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              payo-app
            
            # Clean up
            rm -f payo-image.tar
            
            # Verify container is running
            docker ps | grep payo-app
            
            # Show logs
            docker logs payo-app --tail 20